# CI/CD: build the Windows package and publish it as a downloadable Release.
#
# The packaging job runs on windows-latest because `sharp` is a native module: a
# node_modules installed on Ubuntu contains Linux binaries and will not load on
# Windows. Cross-installing with --os=win32 --cpu=x64 is fragile, so the build happens
# on the platform it ships to.
#
# The packaged app is smoke-tested *after* the zip is extracted into a clean directory.
# If that fails the release job never runs, so a broken tree publishes nothing.
#
# Triggers, and why this shape matters:
#   - pull_request -> main, a milestone branch or a hotfix integration branch: build +
#     smoke test, publish nothing. This is the only way to prove the packaging job runs
#     before the workflow exists on the default branch (`workflow_dispatch` is not available
#     until then), and the Windows packaging job is the only place the deployment glue and
#     the DPAPI round trip actually execute (#59, #83) — a milestone or hotfix branch that
#     skipped it would leave that coverage dark for a whole release.
#   - push -> main: the same build, for the one branch that is always the released
#     state. A milestone or feature push does not repeat the work its PR already did;
#     `main` is kept because a squash- or rebase-merge can produce a tree the PR never
#     built, and a broken main should be visible in minutes rather than at the next
#     tag. Coverage is reduced only where it is redundant, never where it is the only
#     Windows check.
#   - push of a `v*` tag: build + smoke test, then create the Release. The release job
#     alone carries `if: startsWith(github.ref, 'refs/tags/v')`, so the branch filter
#     cannot make a branch push publish anything.
#   - workflow_dispatch: manual run of the same pipeline, no release.
name: Package (Windows)

on:
  pull_request:
    branches: [main, 'milestone/**', 'hotfix/**']
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Read everywhere; only the release job opts into write access.
permissions:
  contents: read

# A repeated push to the same branch must not queue a Windows run behind the one it
# supersedes: queued runs are billed, and the newer push is the tree that matters. A
# tag build publishes a release, so it is never cancelled, whatever lands beside it.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The existing Ubuntu offline suite is the gate. Reusing ci.yml keeps one source of
  # truth for the Node matrix and leaves its behaviour unchanged.
  test:
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    runs-on: windows-latest
    # Native sharp install + zip + smoke test. Bounded so a wedged build cannot hold
    # a Windows runner for GitHub's multi-hour default (issue #37).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      # Fail fast: a tag that disagrees with package.json must never produce an artifact.
      - name: Refuse a mismatched tag
        run: node packaging/check-version.mjs

      - name: Assemble the payload
        run: node packaging/build-payload.mjs

      - name: Zip the payload
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./packaging/build-zip.ps1 -Payload dist/payload -Version $version -OutDir dist

      - name: Write the checksum and the size summary
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip).FullName
          node packaging/checksum.mjs $zip

      # Verify the artifact, not the source: unzip into a clean directory and run it.
      - name: Smoke-test the extracted artifact
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip).FullName
          ./packaging/run-smoke.ps1 -Zip $zip -Corpus corpus -RepoRoot .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  # Execute the deployment glue on the artifact the package job just proved runs.
  # The expensive Windows build happens once; this job downloads its artifact rather
  # than rebuilding. It runs on every trigger the package job does, because the point
  # is to catch an installer/launcher regression on the PR that introduces it, not
  # after a tag. It is cheap next to the build (install + startup shim + two launches),
  # and `timeout-minutes` bounds it so a wedged start cannot hold the runner (issue #37).
  deploy:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist

      # Install, inspect the per-user Startup shim, start the packaged app, run the
      # double-click launcher, uninstall - then prove a failing child is propagated.
      # Each step asserts; the script throws on the first mismatch so the job is red
      # without a human reading the log.
      - name: Exercise install, startup, launcher and uninstall
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip).FullName
          ./packaging/run-deploy.ps1 -Zip $zip

      # The artifact has to exist before DPAPI can be exercised, and a real
      # windows-latest runner is what makes this a demonstration rather than a
      # code-reading exercise. It uses the extracted artifact's own node.exe and
      # app/src/secrets.js (#60).
      - name: Prove the DPAPI credential round trip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip).FullName
          ./packaging/run-dpapi.ps1 -Zip $zip

      # The headless launch above skips the tray by design, and the launcher step only
      # asserts a node.exe process starts - so the systray2 interop layer that had never
      # worked was entered by no automated check. This runs the artifact's own node.exe
      # and app/src/ui/tray-systray.js and asserts the class resolves; it then loads the
      # shipped app/src/ui/icons/*.ico through the same Win32 LoadImage call the tray
      # binary makes, which is the only place in the project the packaged icon is checked.
      # It does not start the native widget (no interactive desktop on a runner).
      - name: Prove the packaged systray2 resolves and the shipped tray icons load
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip).FullName
          ./packaging/run-tray-interop.ps1 -Zip $zip

  release:
    needs: [package, deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist

      # The Release itself is created with the runner's preinstalled `gh`, so no
      # third-party release action is pinned. The default GITHUB_TOKEN is scoped to this
      # job only. `checkout` is for the flag script: a `vX.Y.Z` tag is a normal release,
      # and only a semver pre-release suffix is flagged (#216).
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          pre=$(node packaging/release-flag.mjs)
          gh release create "$tag" \
            --title "PuzzleSolver $tag" \
            --generate-notes \
            $pre \
            dist/*.zip dist/*.sha256
